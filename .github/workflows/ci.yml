name: CI

on:
  push: { branches: [dev, staging, main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, mbstring, intl, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Composer
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Build aset
        run: npm ci && npm run build
      - name: Env uji
        run: cp .env.example .env && php artisan key:generate
      - name: PHPUnit
        run: php artisan test
      - name: smtp-engine
        working-directory: smtp-engine
        run: npm ci && node --check server.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image app
        uses: docker/build-push-action@v6
        with: { context: ., target: app, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build image smtp
        uses: docker/build-push-action@v6
        with: { context: ./smtp-engine, push: false }
