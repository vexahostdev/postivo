# Postivo — stack production/staging.
#   docker compose --env-file .env.production up -d --build
# .env.production (gitignored) berisi kredensial; variabel DB/REDIS di bawah menimpa nilai-nilai host-nya.
name: postivo

x-app: &app
  build: { context: ., target: app }
  image: postivo-app:latest
  env_file: .env.production
  environment: &appenv
    DB_HOST: mysql
    REDIS_HOST: redis
    POSTIVO_SPOOL_DIR: /spool
  volumes:
    - storage:/var/www/html/storage/app/public
    - spool:/spool
    - logs:/var/www/html/storage/logs
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  # --- HTTP(S): app + Caddy ----------------------------------------------------------------------
  app:
    <<: *app
    environment:
      <<: *appenv
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: { context: ., target: web }
    image: postivo-web:latest
    environment:
      APP_DOMAIN: ${POSTIVO_APP_HOST:-postivo.my.id}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

  # --- Worker antrean & scheduler -------------------------------------------------------------------
  queue:
    <<: *app
    command: php artisan queue:work redis --queue=postivo_high,postivo_default,postivo_webhooks,default --sleep=1 --tries=3 --max-time=3600 --memory=256
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  # --- SMTP ingress (587 STARTTLS, 465 TLS) -----------------------------------------------------------
  smtp:
    build: { context: ./smtp-engine }
    image: postivo-smtp:latest
    env_file: .env.production
    environment:
      APP_INTERNAL_URL: http://web
      POSTIVO_SPOOL_DIR: /spool
      SMTP_PORTS: "587:starttls,465:tls"
    ports: ["587:587", "465:465"]
    volumes:
      - spool:/spool
      - caddy_data:/certs-root:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on: [web]
    restart: unless-stopped

  # --- Data -------------------------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-postivo_db}
      MYSQL_USER: ${DB_USERNAME:-postivo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di .env.production}
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF + noeviction: antrean & counter tidak boleh hilang diam-diam.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql:
  redis:
  storage:
  spool:
  logs:
  caddy_data:
  caddy_config:
